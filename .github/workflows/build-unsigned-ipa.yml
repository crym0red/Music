name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify project
        run: |
          set -euo pipefail
          test -d "Fugacious.xcodeproj"
          test -f "Fugacious.xcodeproj/project.pbxproj"
          test -f "Fugacious/Info.plist"
          test -f "Fugacious/Assets.xcassets/Contents.json"
          xcodebuild -list -project "Fugacious.xcodeproj"

      - name: Build unsigned app
        run: |
          set -euo pipefail

          rm -rf build Payload
          mkdir -p build Payload

          xcodebuild \
            -project "Fugacious.xcodeproj" \
            -scheme "Fugacious" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Fugacious.app"

          test -d "$APP_PATH"
          cp -R "$APP_PATH" "Payload/Fugacious.app"

          /usr/bin/zip -qry "build/Fugacious-unsigned.ipa" Payload

          echo "Created:"
          ls -lh "build/Fugacious-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fugacious-unsigned-ipa
          path: build/Fugacious-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
