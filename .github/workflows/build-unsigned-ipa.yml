name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify project and assets
        run: |
          set -euo pipefail
          test -d "Fugacious.xcodeproj"
          test -f "Fugacious.xcodeproj/project.pbxproj"
          test -f "Fugacious/Info.plist"
          test -f "Fugacious/Assets.xcassets/Contents.json"
          test -f "Fugacious/Assets.xcassets/AppIcon.appiconset/Contents.json"
          test -f "Fugacious/Assets.xcassets/FugaciousMark.imageset/FugaciousMark.png"
          xcodebuild -list -project "Fugacious.xcodeproj"

      - name: Build unsigned app
        run: |
          set -euo pipefail

          rm -rf build Payload
          mkdir -p build Payload

          xcodebuild \
            -project "Fugacious.xcodeproj" \
            -scheme "Fugacious" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Fugacious.app"
          EXECUTABLE="$APP_PATH/Fugacious"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$EXECUTABLE"
          test -x "$EXECUTABLE"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          test "$BUNDLE_ID" = "com.fugacious.music"
          test "$EXEC_NAME" = "Fugacious"

          file "$EXECUTABLE"
          /usr/bin/lipo -info "$EXECUTABLE" || true

          cp -R "$APP_PATH" "Payload/Fugacious.app"
          /usr/bin/zip -qry "build/Fugacious-unsigned.ipa" Payload

          test -s "build/Fugacious-unsigned.ipa"
          unzip -l "build/Fugacious-unsigned.ipa" | grep -E "Payload/Fugacious.app/Fugacious$"
          ls -lh "build/Fugacious-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fugacious-unsigned-ipa
          path: build/Fugacious-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
